<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Entradas de concierto</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            text-align: center;
            padding: 40px;
        }

        .concierto {
            background-color: white;
            width: 350px;
            margin: auto;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 8px #cccccc;
        }

        .precio {
            font-size: 20px;
            font-weight: bold;
        }

        input {
            width: 60px;
            padding: 8px;
            margin: 15px;
        }

        button {
            padding: 10px 25px;
            border: none;
            border-radius: 5px;
            background-color: #333;
            color: white;
            cursor: pointer;
        }

        #total {
            margin-top: 25px;
            font-size: 24px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="concierto">

        <h1>🎵 Concierto </h1>

        <p class="precio">
            Precio de la entrada: 25 <span>€</span>
        </p>

        <label>
            Número de entradas:
            <input id="numeroEntradas" type="number" value="1">
        </label>

        <br>

        <button id="calcular">
            Calcular
        </button>

        <div id="total">
            Total: <span id="precio-total">--</span> <span>€</span>
        </div>

    </div>


    <script>

        const precioEntrada = 25;

        const numeroEntradas = document.querySelector("#numeroEntradas");
        const botonCalcular = document.querySelector("#calcular");
        const precioTotal = document.querySelector("#precio-total");

        botonCalcular.addEventListener("click", function () {
            const total = Number(numeroEntradas.value) * precioEntrada;
            precioTotal.textContent = total;
        });

    </script>

</body>

</html>
